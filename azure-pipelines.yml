trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'
  artifactName: 'serverless-order-platform'

steps:
  - task: NodeTool@0
    displayName: 'Use Node.js $(nodeVersion)'
    inputs:
      versionSpec: '$(nodeVersion)'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm test --if-present
    displayName: 'Run tests'

  - script: npm audit --audit-level=high
    displayName: 'Run dependency security audit'
    continueOnError: true

  - script: |
      npm install -g azure-functions-core-tools@4 --unsafe-perm=true
      func --version
    displayName: 'Install Azure Functions Core Tools'

  - script: |
      mkdir -p $(Build.ArtifactStagingDirectory)/app
      rsync -av \
        --exclude='.git' \
        --exclude='node_modules' \
        --exclude='.env' \
        --exclude='local.settings.json' \
        ./ $(Build.ArtifactStagingDirectory)/app
    displayName: 'Prepare Function App package'

  - task: ArchiveFiles@2
    displayName: 'Create deployment artifact'
    inputs:
      rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
      replaceExistingArchive: true

  - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
    artifact: 'drop'
    displayName: 'Publish build artifact'