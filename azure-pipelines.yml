trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  nodeVersion: '20.x'
  artifactName: 'serverless-order-platform'

stages:
  - stage: Validate
    displayName: 'Validate and Build'
    jobs:
      - job: Build
        displayName: 'Build and Test'
        pool:
          vmImage: 'ubuntu-latest'

        steps:
          - task: NodeTool@0
            displayName: 'Use Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm test --if-present
            displayName: 'Run tests'

          - script: npm audit --audit-level=high
            displayName: 'Run dependency security audit'
            continueOnError: true

          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/app
              rsync -av \
                --exclude='.git' \
                --exclude='.env' \
                --exclude='local.settings.json' \
                ./ $(Build.ArtifactStagingDirectory)/app
            displayName: 'Prepare Function App package'

          - task: ArchiveFiles@2
            displayName: 'Create deployment artifact'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/app'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
              replaceExistingArchive: true
            
          - script: |
                  echo "Current directory:"
                  pwd

                  echo "Root files:"
                  ls -la

                  echo "Source tree:"
                  find . -maxdepth 3 -type f | sort                  

                  echo "Function files:"
                  find . -path "*src/functions*" -type f -print
            displayName: "Debug folder structure before package"

          - publish: '$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip'
            artifact: 'drop'
            displayName: 'Publish build artifact'

          - script: |
              echo "Package contents:"
              unzip -l "$(Build.ArtifactStagingDirectory)/$(artifactName)-$(Build.BuildId).zip" | head -100
            displayName: "Inspect function zip"

  - stage: Deploy_Development
    displayName: 'Deploy to Development'
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployDevelopment
        displayName: 'Deploy Function App to Development'
        environment: 'Development'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureFunctionApp@2
                  inputs:
                    connectedServiceNameARM: 'Azure subscription 1(65f91310-4b43-4f79-8b80-53df1f58d691)'
                    appType: 'functionApp'
                    isFlexConsumption: true
                    appName: 'mory-order-functions-2026'
                    package: '$(Pipeline.Workspace)/**/*.zip'
                
                - script: |
                    echo "Waiting for Function App to warm up..."
                    sleep 20
                    echo "Checking application readiness..."
                    response=$(curl -f -s https://mory-order-functions-2026.azurewebsites.net/api/health)
                    echo "Raw Response: $response"
                    
                    # Robust matching check for text containing "Healthy", "OK", or status properties
                    if echo "$response" | grep -Ei "ok|healthy" > /dev/null; then
                      echo "Function App health verification successful."
                    else
                      echo "ERROR: Function App returned unexpected health status or empty string."
                      exit 1
                    fi
                  displayName: 'Verify Function App health'

  - stage: Deploy_Production
    displayName: 'Deploy to Production'
    dependsOn: 
     - Validate
     - Deploy_Development
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy Function App to Production'
        environment: 'Production'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureFunctionApp@2
                  inputs:
                    connectedServiceNameARM: 'Azure subscription 1(65f91310-4b43-4f79-8b80-53df1f58d691)'
                    appType: 'functionApp'
                    isFlexConsumption: true
                    appName: 'mory-order-functions-2026-staging' # Verified production string endpoint
                    package: '$(Pipeline.Workspace)/**/*.zip'
